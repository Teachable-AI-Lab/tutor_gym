<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">

    <title>Box And Arrows</title>

    <link rel="stylesheet"
          href="https://cdn.ctat.cs.cmu.edu/releases/current/CTAT.min.css">

    <script src="https://cdn.ctat.cs.cmu.edu/releases/current/jquery.min.js"></script>
    <script src="https://cdn.ctat.cs.cmu.edu/releases/current/ctat.min.js"></script>
    <script src="https://cdn.ctat.cs.cmu.edu/releases/current/ctatloader.js"></script>

    <style>
        .tutor-container {
            position: relative;
            width: 600px;
            height: 400px;
            border: 1px solid #ccc;
            margin: 20px;
        }

        .ctat-component {
            position: absolute;
        }

        #hint {
            left: 124px;
            top: 5px;
        }

        #done {
            left: 42px;
            top: 5px;
        }

        #JCommTable {
            left: 146px;
            top: 81px;
        }

        #JCommTable3 {
            left: 200px;
            top: 123px;
        }

        #JCommTable2 {
            left: 146px;
            top: 164px;
        }
    </style>
</head>

<body>

<div class="tutor-container">

    <!-- CTAT buttons -->
    <div id="hint"
         class="CTATHintButton ctat-component">
    </div>

    <div id="done"
         class="CTATDoneButton ctat-component">
    </div>


    <!-- First row -->
    <table id="JCommTable"
           class="ctat-component">

        <tr>
            <td>
                <div id="JCommTable_C1R1"
                     class="CTATTextInput">
                </div>
            </td>

            <td>
                <div id="JCommTable_C2R1"
                     class="CTATTextInput">
                </div>
            </td>

            <td>
                <div id="JCommTable_C3R1"
                     class="CTATTextInput">
                </div>
            </td>
        </tr>

    </table>


    <!-- Middle box -->
    <table id="JCommTable3"
           class="ctat-component">

        <tr>
            <td>
                <div id="JCommTable3_C1R1"
                     class="CTATTextInput">
            </div>
            </td>
        </tr>

    </table>


    <!-- Second row -->
    <table id="JCommTable2"
           class="ctat-component">

        <tr>
            <td>
                <div id="JCommTable2_C1R1"
                     class="CTATTextInput">
                </div>
            </td>

            <td>
                <div id="JCommTable2_C2R1"
                     class="CTATTextInput">
                </div>
            </td>

            <td>
                <div id="JCommTable2_C3R1"
                     class="CTATTextInput">
                </div>
            </td>
        </tr>

    </table>

</div>

</body>
</html>
